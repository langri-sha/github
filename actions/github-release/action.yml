name: GitHub release
description: |-
  Creates a GitHub release with generated notes for each tag on a commit that
  does not have one yet, so reruns are safe. The tags must already be pushed.

inputs:
  ref:
    description: |-
      The commit whose tags to release. Nothing is released when it has none.
    required: false
    default: HEAD
  repository:
    description: The repository to create the releases in.
    required: false
    default: ${{ github.repository }}
  token:
    description: |-
      A token with `contents: write` on the repository.
    required: false
    default: ${{ github.token }}

runs:
  using: composite

  steps:
    - name: Create releases
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        GH_REPO: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        for tag in $(git tag --points-at "$REF"); do
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released."
          else
            gh release create "$tag" --verify-tag --generate-notes
          fi
        done

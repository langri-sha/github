name: Workspace

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/check.yml
    with:
      dagger: true
      dagger-version: v1.0.0-beta.18
      prettier: true
      projen: true
      typescript: true
    secrets: inherit

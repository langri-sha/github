name: Check

on:
  workflow_call:
    inputs:
      beachball:
        description: >-
          Run Beachball checks. With `dagger`, the Dagger job first hands the
          beachball module the merge base and the changed paths, and the
          post-upgrade job, after its fixes, has the module write change files
          titled with the pull request's title. The workspace then installs
          `github.com/langri-sha/dagger/beachball` as `beachball`.
        type: boolean
        default: false
      dagger:
        description: >-
          Run `dagger check` in place of the Lint and Vitest jobs, and the
          post-upgrade fixes through Dagger, with the engine version the Dagger
          modules pin, or `dagger-version`. The post-upgrade job first loads
          every module, so `dagger.lock` gains the refs an update moved. The
          other inputs then only pick the fixes: `eslint` and `prettier` call
          `ci fix`, `vitest` calls `ci snapshots`, `projen` runs the `projen`
          module's generator or `ci/projen`, `packages` the `ci/packages` one,
          and `uv` the `uv` module's, one at a time. A workspace that lists
          `github.com/langri-sha/dagger/changesets` as `changesets` gets the
          merge base and the changed paths handed to the Dagger job first, and
          its post-upgrade job has the module write an empty change file. The
          workspace installs
          `github.com/langri-sha/dagger/ci` at v1.2.0 or later as `ci`, and
          `github.com/dagger/python/uv` as `uv` for `uv`. On Renovate and
          Dependabot pull requests, the Dagger job then commits what its checks
          pinned in `dagger.lock`, such as an image whose tag moved.
        type: boolean
        default: false
      runs-on:
        description: >-
          Runner label for every job, e.g. a self-hosted scale set. The job
          that commits the Renovate fixes reads the GitHub App's key, so a
          caller that sets this runs that key on its own runner.
        type: string
        default: ubuntu-latest
      dagger-version:
        description: >-
          Dagger engine version to run, e.g. `v1.0.0-beta.15`, in place of the
          one resolved from the module manifests. Required when the workspace
          has no module of its own and installs them all from git refs.
        type: string
        default: ''
      posthog-host:
        description: PostHog ingestion host that Dagger traces are exported to.
        type: string
        default: https://eu.i.posthog.com
      posthog-app-host:
        description: PostHog app host that Dagger trace links point to.
        type: string
        default: https://eu.posthog.com
      posthog-project-id:
        description: >-
          PostHog project ID. When set along with the project token, the Dagger
          job links its trace and exposes it as the `posthog-trace-url` output.
        type: string
        default: ''
      posthog-project-token:
        description: >-
          PostHog project token. When set, Dagger traces are exported to
          PostHog.
        type: string
        default: ''
      eslint:
        description: Run ESLint checks.
        type: boolean
        default: false
      prettier:
        description: Run Prettier checks.
        type: boolean
        default: false
      typescript:
        description: Run TypeScript checks.
        type: boolean
        default: false
      packages:
        description: Run package checks.
        type: boolean
        default: false
      projen:
        description: >-
          Run projen checks. With `dagger`, the post-upgrade job synthesizes
          with the `projen/synth` generator when the workspace installs
          `github.com/langri-sha/dagger/projen` at v1.5.0 or later as `projen`,
          and with `ci/projen` otherwise. A workspace that installs both skips
          the latter with `skip = ["projen"]` under `[modules.ci.generate]`, or
          the job fails, as it does when the workspace has neither.
        type: boolean
        default: false
      uv:
        description: Refresh uv lockfiles after Projen synthesis.
        type: boolean
        default: false
      vitest:
        description: Run Vitest checks.
        type: boolean
        default: false
    outputs:
      posthog-trace-url:
        description: >-
          Link to the Dagger trace in PostHog, or empty when there is none.
        value: ${{ jobs.dagger.outputs.posthog-trace-url }}
    secrets:
      APP_CLIENT_ID:
        description: GitHub App client ID used for the post-upgrade push.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key used for the post-upgrade push.
        required: false

jobs:
  post-upgrade:
    name: Renovate Post-Upgrade
    runs-on: ${{ inputs.runs-on }}

    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.actor == 'renovate[bot]' || github.actor == 'dependabot[bot]')
    permissions:
      contents: read
    outputs:
      has-changes: ${{ steps.git-changes.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        if: ${{ !inputs.dagger }}
        uses: langri-sha/github/actions/pnpm@v0.31.0

      - name: Apply ESLint fixes
        if: inputs.eslint && !inputs.dagger
        run: pnpm eslint --fix .

      - name: Apply Prettier fixes
        if: inputs.prettier && !inputs.dagger
        run: pnpm prettier --write .

      - name: Update Vitest snapshots
        if: inputs.vitest && !inputs.dagger
        run: pnpm vitest --update --passWithNoTests

      - name: Synthesize Projen changes
        if: inputs.projen && !inputs.dagger
        run: pnpm projen --no-post

      - name: Set up updated pnpm
        if: inputs.projen && !inputs.dagger
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up updated Node.js
        if: inputs.projen && !inputs.dagger
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: package.json

      - name: Install updated dependencies
        if: inputs.projen && !inputs.dagger
        run: pnpm install --no-frozen-lockfile

      - name: Resynthesize after installing generator updates
        if: inputs.projen && !inputs.dagger
        run: pnpm projen

      - name: Refresh generated dependency lockfile
        if: inputs.projen && !inputs.dagger
        run: pnpm install --no-frozen-lockfile

      - name: Set up uv
        if: inputs.uv && !inputs.dagger
        uses: astral-sh/setup-uv@v10.3.2

      - name: Refresh uv lockfile
        if: inputs.uv && !inputs.dagger
        run: uv lock

      - name: Verify uv lockfile
        if: inputs.uv && !inputs.dagger
        run: uv lock --check

      - name: Resolve Dagger version
        id: dagger-version
        if: inputs.dagger && !inputs.dagger-version
        uses: langri-sha/github/actions/dagger-version@v0.31.0

      - name: Set up Dagger
        if: inputs.dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ inputs.dagger-version || steps.dagger-version.outputs.version }}

      - name: Refresh dagger.lock
        if: inputs.dagger
        run: dagger check -l

      - name: Apply ESLint and Prettier fixes with Dagger
        if: inputs.dagger && (inputs.eslint || inputs.prettier)
        run: dagger call -y ci fix

      - name: Update Vitest snapshots with Dagger
        if: inputs.dagger && inputs.vitest
        run: dagger call -y ci snapshots

      - name: Synthesize projen with Dagger
        if: inputs.dagger && inputs.projen
        run: |
          generators=$(dagger generate -l --require-load -f link projen ci/projen)

          has_generator() {
            grep -qE "[?&]generator=$1\$" <<< "$generators"
          }

          if has_generator projen/synth && has_generator ci/projen; then
            echo '::error::The workspace runs both projen/synth and ci/projen. Skip the latter with [modules.ci.generate] skip = ["projen"] in dagger.toml.'
            exit 1
          elif has_generator projen/synth; then
            dagger generate -y projen
          elif has_generator ci/projen; then
            dagger generate -y ci/projen
          else
            echo '::error::The workspace has neither projen/synth nor ci/projen to synthesize projen with.'
            exit 1
          fi

      - name: Sort and fix the package manifests with Dagger
        if: inputs.dagger && inputs.packages
        run: dagger generate -y ci/packages

      - name: Refresh uv lockfiles with Dagger
        if: inputs.dagger && inputs.uv
        run: dagger generate -y uv

      - name: Stage generated changes
        if: inputs.beachball && !inputs.dagger
        run: git add -A

      - name: Create Beachball changes
        if: inputs.beachball && !inputs.dagger
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm beachball change \
            --message "$TITLE" \
            --no-commit \
            --type patch \
            --yes

      - name: Check Beachball changes
        if: inputs.beachball && !inputs.dagger
        run: pnpm beachball check

      - name: Find merge base for Beachball
        if: inputs.dagger && inputs.beachball
        uses: langri-sha/github/actions/merge-base@683f011927eadcc5ed65f78d4596d2b29a670144

      - name: Create Beachball changes with Dagger
        if: inputs.dagger && inputs.beachball
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          dagger call -y beachball change --message "$TITLE"
          rm -r .merge-base

      - name: Look for the Changesets module
        id: changesets
        if: inputs.dagger
        run: |
          if grep -qs '^\[modules\.changesets\]' dagger.toml; then
            echo 'listed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Find merge base for Changesets
        if: steps.changesets.outputs.listed == 'true'
        uses: langri-sha/github/actions/merge-base@683f011927eadcc5ed65f78d4596d2b29a670144

      - name: Create Changesets change files with Dagger
        if: steps.changesets.outputs.listed == 'true'
        run: |
          dagger generate -y changesets
          rm -r .merge-base

      - name: Check for Git changes
        id: git-changes
        run: |
          if [[ `git status --porcelain | wc -c` -ne '0' ]]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create patch
        run: |
          git add -A
          git diff --cached > .diff.patch

      - name: Upload diff
        uses: actions/upload-artifact@v7
        if: ${{ steps.git-changes.outputs.has-changes }}
        with:
          include-hidden-files: true
          name: diff
          path: .diff.patch

  commit-upgrade-changes:
    name: Commit Upgrade Changes
    runs-on: ${{ inputs.runs-on }}
    if: needs.post-upgrade.outputs.has-changes == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.actor == 'renovate[bot]' || github.actor == 'dependabot[bot]')
    needs: [post-upgrade]

    permissions:
      contents: write
      id-token: write
    env:
      PATCH: diff
      MESSAGE: 'chore(deps): Apply upgrade changes'

    steps:
      - &choose-credentials
        name: Choose where the App credentials come from
        id: credentials
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY_SECRET: ${{ vars.APP_PRIVATE_KEY_SECRET }}
          GOOGLE_PROJECT: ${{ vars.GOOGLE_PROJECT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          SECRET_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          SECRET_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -n $SECRET_CLIENT_ID && -n $SECRET_PRIVATE_KEY ]]; then
            echo 'federate=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for variable in APP_CLIENT_ID APP_PRIVATE_KEY_SECRET GOOGLE_PROJECT WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z ${!variable} ]]; then
              echo "::error::Neither the App secrets nor the $variable variable is set on $GITHUB_REPOSITORY."
              exit 1
            fi
          done

          echo 'federate=true' >> "$GITHUB_OUTPUT"

      - &authenticate-to-google-cloud
        name: Authenticate to Google Cloud
        id: google-cloud
        if: steps.credentials.outputs.federate == 'true'
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ vars.GOOGLE_PROJECT }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - &read-private-key
        name: Read the App's private key
        id: secret-manager
        if: steps.credentials.outputs.federate == 'true'
        uses: google-github-actions/get-secretmanager-secrets@v3.0.0
        with:
          secrets: private-key:${{ vars.APP_PRIVATE_KEY_SECRET }}

      - &generate-app-token
        name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.credentials.outputs.federate == 'true' && vars.APP_CLIENT_ID || secrets.APP_CLIENT_ID }}
          private-key: ${{ steps.credentials.outputs.federate == 'true' && steps.secret-manager.outputs.private-key || secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - &remove-google-credentials
        name: Remove the Google credentials
        if: steps.credentials.outputs.federate == 'true'
        run: rm "${{ steps.google-cloud.outputs.credentials_file_path }}"

      - &checkout-pull-request
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - &download-patch
        name: Download diff
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PATCH }}

      - &reject-unsafe-paths
        name: Reject unsafe paths in patch
        run: |
          git apply --check .diff.patch
          if git apply --numstat .diff.patch | awk -F '\t' '{print $3}' | grep -E '^\.github/(workflows|actions)/'; then
            echo '::error::Generated post-upgrade patches may not modify GitHub Actions files.'
            exit 1
          fi

      - &configure-git-user
        name: Configure Git user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_NAME="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_NAME}" -q .id)
          git config user.name  "${BOT_NAME}"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"

      - &apply-patch
        name: Apply diff
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git apply .diff.patch
          git add .
          git commit -m "$MESSAGE"
          git push origin "$HEAD_REF"

  lint:
    name: Lint
    runs-on: ${{ inputs.runs-on }}
    needs: [commit-upgrade-changes]
    if: always() && !inputs.dagger
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Setup PNPM
        uses: langri-sha/github/actions/pnpm@v0.31.0

      - name: ESLint
        if: inputs.eslint
        run: pnpm eslint .

      - name: Prettier
        if: inputs.prettier
        run: pnpm prettier --check .

      - name: Beachball
        if: github.event_name == 'pull_request' && inputs.beachball
        run: |
          pnpm beachball check ||
          (
            echo "::error::Beachball changes detected. Run 'pnpm beachball change' and commit the changes.";
            exit 1
          )

      - name: Sort packages
        if: inputs.packages
        run: |
          pnpx sort-package-json@latest --check \
            ./apps/*/package.json \
            ./packages/*/package.json \
            package.json

      - name: Check packages
        if: inputs.packages
        run: |
          pnpm -r exec npm pkg fix

          if [[ $(git status --porcelain) ]]; then
            echo '::error::Some packages need fixing.'
            git status
            git diff
            exit 1
          fi

      - name: Check projen configuration
        if: inputs.projen
        run: |
          pnpm projen

          if [[ $(git status --porcelain) ]]; then
            echo '::error::Some projen changes haven not been appplied. Run `pnpm projen`.'
            git status
            git diff
            exit 1
          fi

      - name: TypeScript
        if: inputs.typescript
        run: pnpm tsc --build .

  vitest:
    name: Vitest
    runs-on: ${{ inputs.runs-on }}
    needs: [commit-upgrade-changes]
    if: always() && inputs.vitest && !inputs.dagger
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: langri-sha/github/actions/pnpm@v0.31.0

      - name: Vitest
        run: pnpm vitest --passWithNoTests

  dagger:
    name: Dagger
    runs-on: ${{ inputs.runs-on }}
    needs: [commit-upgrade-changes]
    if: always() && inputs.dagger && needs.commit-upgrade-changes.result != 'success'
    permissions:
      contents: read
    outputs:
      posthog-trace-url: ${{ steps.trace.outputs.url }}
      lock-changed: ${{ steps.lock.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Look for the Changesets module
        id: changesets
        run: |
          if grep -qs '^\[modules\.changesets\]' dagger.toml; then
            echo 'listed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Find merge base
        if: inputs.beachball || steps.changesets.outputs.listed == 'true'
        uses: langri-sha/github/actions/merge-base@v0.31.0

      - name: Resolve Dagger version
        id: dagger-version
        if: ${{ !inputs.dagger-version }}
        uses: langri-sha/github/actions/dagger-version@v0.31.0

      - name: Record start time
        id: start
        if: inputs.posthog-project-token
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check
        uses: dagger/dagger-for-github@v8.4.1
        env:
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ inputs.posthog-project-token && format('{0}/i/v1/traces', inputs.posthog-host) || '' }}
          # Dagger's exporter only reads the generic headers variable and
          # overrides OTEL_EXPORTER_OTLP_TRACES_HEADERS.
          OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.posthog-project-token && format('Authorization=Bearer {0}', inputs.posthog-project-token) || '' }}
          OTEL_RESOURCE_ATTRIBUTES: github.repository=${{ github.repository }},github.ref=${{ github.ref }},github.sha=${{ github.sha }},github.run_id=${{ github.run_id }},github.run_attempt=${{ github.run_attempt }}
        with:
          version: ${{ inputs.dagger-version || steps.dagger-version.outputs.version }}
          verb: check

      - name: Find what the checks pinned
        id: lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.login == 'dependabot[bot]')
        run: |
          git add --intent-to-add dagger.lock
          git diff --binary -- dagger.lock > .diff.patch
          if [[ -s .diff.patch ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the dagger.lock diff
        if: steps.lock.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: dagger-lock
          path: .diff.patch

      - name: Link PostHog trace
        id: trace
        if: always() && inputs.posthog-project-token && steps.start.outputs.time
        env:
          PROJECT_ID: ${{ inputs.posthog-project-id }}
          APP_HOST: ${{ inputs.posthog-app-host }}
          STARTED: ${{ steps.start.outputs.time }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ $PROJECT_ID =~ ^[0-9]+$ ]]; then
            query=$(jq -rn \
              --arg from "$STARTED" \
              --arg to "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg runId "$RUN_ID" \
              --arg runAttempt "$RUN_ATTEMPT" \
              '[
                "view=spans",
                "dateRange=\({date_from: $from, date_to: $to} | tojson | @uri)",
                "filterGroup=\({
                  type: "AND",
                  values: [{
                    type: "AND",
                    values: [
                      {key: "github.run_id", value: [$runId]},
                      {key: "github.run_attempt", value: [$runAttempt]}
                    ] | map(. + {operator: "exact", type: "span_resource_attribute"})
                  }]
                } | tojson | @uri)"
              ] | join("&")')
            url="${APP_HOST%/}/project/${PROJECT_ID}/tracing?${query}"
            echo "url=${url}" >> "$GITHUB_OUTPUT"
            echo "[Dagger trace in PostHog](${url})" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n $PROJECT_ID ]]; then
            echo '::warning::The PostHog project ID must be numeric, so the trace is not linked.'
          fi

  commit-lock:
    name: Commit dagger.lock
    runs-on: ${{ inputs.runs-on }}
    needs: [dagger]
    if: ${{ !cancelled() && needs.dagger.result == 'success' && needs.dagger.outputs.lock-changed == 'true' }}

    permissions:
      contents: write
      id-token: write
    env:
      PATCH: dagger-lock
      MESSAGE: 'chore(deps): Pin the images in dagger.lock'

    steps:
      - *choose-credentials
      - *authenticate-to-google-cloud
      - *read-private-key
      - *generate-app-token
      - *remove-google-credentials
      - *checkout-pull-request
      - *download-patch
      - *reject-unsafe-paths
      - *configure-git-user
      - *apply-patch

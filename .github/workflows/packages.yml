name: Packages

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: false
      github-releases:
        type: boolean
        default: false
      registry-url:
        type: string
        default: https://registry.npmjs.org
      scope:
        type: string
        required: false
      tag-template:
        type: string
        required: false
    secrets:
      APP_CLIENT_ID:
        description: GitHub App Client ID used for authenticated release Git operations.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key used for authenticated release Git operations.
        required: false

jobs:
  mode:
    name: Mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.detect.outputs.changesets }}
    steps:
      - name: Detect Changesets
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if error=$(gh api "repos/$GITHUB_REPOSITORY/contents/.changeset/config.json?ref=$GITHUB_SHA" --silent 2>&1); then
            echo 'changesets=true' >> "$GITHUB_OUTPUT"

            if [[ $GITHUB_REF != "$DEFAULT_REF" ]]; then
              echo "::error::Changesets releases run on the default branch, not on $GITHUB_REF."
              exit 1
            fi
          elif [[ $error != *'HTTP 404'* ]]; then
            echo "::error::$error"
            exit 1
          fi

  publish:
    name: Publish
    needs: [mode]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Choose where the App credentials come from
        id: credentials
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY_SECRET: ${{ vars.APP_PRIVATE_KEY_SECRET }}
          GOOGLE_PROJECT: ${{ vars.GOOGLE_PROJECT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          SECRET_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          SECRET_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -n $SECRET_CLIENT_ID && -n $SECRET_PRIVATE_KEY ]]; then
            echo 'federate=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for variable in APP_CLIENT_ID APP_PRIVATE_KEY_SECRET GOOGLE_PROJECT WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z ${!variable} ]]; then
              echo "::error::Neither the App secrets nor the $variable variable is set on $GITHUB_REPOSITORY."
              exit 1
            fi
          done

          echo 'federate=true' >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: google-cloud
        if: steps.credentials.outputs.federate == 'true'
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ vars.GOOGLE_PROJECT }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Read the App's private key
        id: secret-manager
        if: steps.credentials.outputs.federate == 'true'
        uses: google-github-actions/get-secretmanager-secrets@v3.0.0
        with:
          secrets: private-key:${{ vars.APP_PRIVATE_KEY_SECRET }}

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.credentials.outputs.federate == 'true' && vars.APP_CLIENT_ID || secrets.APP_CLIENT_ID }}
          private-key: ${{ steps.credentials.outputs.federate == 'true' && steps.secret-manager.outputs.private-key || secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Remove the Google credentials
        if: steps.credentials.outputs.federate == 'true'
        run: rm "${{ steps.google-cloud.outputs.credentials_file_path }}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: ${{ needs.mode.outputs.changesets == 'true' }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup PNPM
        uses: langri-sha/github/actions/pnpm@v0.31.0
        with:
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}

      - name: Upgrade npm for OIDC trusted publishing
        if: needs.mode.outputs.changesets != 'true'
        run: npm install -g npm@11 # npm 12 array-wraps `npm show --json`, breaking beachball 2.65.5's registry read; 11.x still supports OIDC trusted publishing (>=11.5.1)

      - name: Configure Git user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_NAME="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_NAME}" -q .id)
          git config user.name  "${BOT_NAME}"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"

      - name: Build composite projects
        if: needs.mode.outputs.changesets != 'true'
        run: pnpm tsc --build .

      - name: Publish
        if: needs.mode.outputs.changesets != 'true'
        run: |
          pnpm beachball publish \
            --access public \
            --message "feat(beachball): Publish packages" \
            --new \
            --yes

      - name: Tag published packages
        if: needs.mode.outputs.changesets != 'true' && inputs.tag-template
        env:
          REF: origin/${{ github.event.repository.default_branch }}
          TEMPLATE: ${{ inputs.tag-template }}
        run: |
          tags=()

          for file in $(git diff --name-only HEAD "$REF" -- ':(glob)**/package.json'); do
            manifest=$(git show "$REF:$file")
            version=$(jq -r .version <<< "$manifest")

            if [[ $(jq -r '.private // false' <<< "$manifest") == true ||
              $(git show "HEAD:$file" 2> /dev/null | jq -r .version) == "$version" ]]; then
              continue
            fi

            tag=${TEMPLATE//\{name\}/$(jq -r .name <<< "$manifest")}
            tag=${tag//\{version\}/$version}
            notes=$(git show "$REF:$(dirname "$file")/CHANGELOG.md" 2> /dev/null |
              awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found && /^### / { body = 1 } body')
            git tag -a --cleanup=whitespace -m "${notes:-$tag}" "$tag" "$REF"
            tags+=("$tag")
          done

          if (( ${#tags[@]} )); then
            git push origin "${tags[@]}"
          fi

      - name: Version packages
        id: version
        if: needs.mode.outputs.changesets == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          shopt -s nullglob
          pending=()
          for file in .changeset/*.md; do
            [[ $file == .changeset/README.md ]] || pending+=("$file")
          done

          if (( ! ${#pending[@]} )); then
            echo '::notice::No change files are pending, so nothing is released.'
            exit 0
          fi

          pnpm changeset version
          git add --all
          git commit -m 'Release packages'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          echo 'released=true' >> "$GITHUB_OUTPUT"

      - name: Tag released versions
        if: steps.version.outputs.released == 'true'
        run: |
          pnpm changeset tag

          mapfile -t tags < <(git tag --points-at HEAD)
          if (( ${#tags[@]} )); then
            git push origin "${tags[@]}"
          fi

      - name: Create GitHub releases
        if: steps.version.outputs.released == 'true' || needs.mode.outputs.changesets != 'true' && inputs.github-releases
        uses: langri-sha/github/actions/github-release@v0.31.0
        with:
          ref: ${{ needs.mode.outputs.changesets == 'true' && 'HEAD' || format('origin/{0}', github.event.repository.default_branch) }}
          token: ${{ steps.app-token.outputs.token }}

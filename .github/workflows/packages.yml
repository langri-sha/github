name: Packages

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: false
      github-releases:
        type: boolean
        default: false
      registry-url:
        type: string
        default: https://registry.npmjs.org
      scope:
        type: string
        required: false
    secrets:
      APP_CLIENT_ID:
        description: GitHub App Client ID used for authenticated release Git operations.
        required: true
      APP_PRIVATE_KEY:
        description: GitHub App private key used for authenticated release Git operations.
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup PNPM
        uses: langri-sha/github/actions/pnpm@v0.16.0
        with:
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11 # npm 12 array-wraps `npm show --json`, breaking beachball 2.65.5's registry read; 11.x still supports OIDC trusted publishing (>=11.5.1)

      - name: Configure Git user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_NAME="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_NAME}" -q .id)
          git config user.name  "${BOT_NAME}"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"

      - name: Build composite projects
        run: pnpm tsc --build .

      - name: Publish
        run: |
          pnpm beachball publish \
            --access public \
            --message "feat(beachball): Publish packages" \
            --new \
            --yes

      # The checkout fetches no tags, so these are the ones beachball created
      # and pushed for the versions it published.
      - name: List published tags
        id: tags
        if: inputs.github-releases
        run: echo "tags=$(git tag --list | paste -sd ' ')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub releases
        if: inputs.github-releases
        uses: langri-sha/github/actions/github-release@62945bceb2f5a065572e1f4ed992483eb0df3fb3
        with:
          tags: ${{ steps.tags.outputs.tags }}
          token: ${{ steps.app-token.outputs.token }}

name: Actions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/actions.yml
      - actions/dagger-version/**
      - actions/github-release/**
      - actions/merge-base/**
      - actions/posthog-trace-status/**
  pull_request:
    paths:
      - .github/workflows/actions.yml
      - actions/dagger-version/**
      - actions/github-release/**
      - actions/merge-base/**
      - actions/posthog-trace-status/**

jobs:
  dagger-version:
    name: Dagger version (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: valid
            version: v1.0.0-beta.14
          - fixture: no-manifests
          - fixture: missing-engine-version
          - fixture: invalid-engine-version
          - fixture: mismatched-engine-versions

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        continue-on-error: true
        uses: ./actions/dagger-version
        with:
          working-directory: actions/dagger-version/fixtures/${{ matrix.fixture }}

      - name: Check result
        env:
          OUTCOME: ${{ steps.resolve.outcome }}
          ACTUAL: ${{ steps.resolve.outputs.version }}
          EXPECTED: ${{ matrix.version }}
        run: |
          expected_outcome=$([[ -n "$EXPECTED" ]] && echo success || echo failure)

          if [[ "$OUTCOME" != "$expected_outcome" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Expected $expected_outcome with version '$EXPECTED', got $OUTCOME with version '$ACTUAL'."
            exit 1
          fi

  github-release:
    name: GitHub release (${{ matrix.case }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: no-tags
          - case: released-tags
            tags: v0.16.0 v0.17.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag HEAD
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          for tag in $TAGS; do
            git tag "$tag"
          done

      - name: Create releases
        uses: ./actions/github-release

  github-release-notes:
    name: GitHub release notes (${{ matrix.case }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: annotated
            message: |-
              ### Patches

              - Fix the thing
            notes: |-
              ### Patches

              - Fix the thing
          - case: tag-name
            message: v0.0.0-test
          - case: lightweight

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stub gh
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" << 'EOF'
          #!/usr/bin/env bash
          [[ $2 == view ]] && exit 1
          while (( $# )); do
            [[ $1 == --notes ]] && printf '%s' "$2" > "$RUNNER_TEMP/notes"
            shift
          done
          EOF
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Tag HEAD
        env:
          MESSAGE: ${{ matrix.message }}
        run: |
          if [[ -n $MESSAGE ]]; then
            git -c user.name=test -c user.email=test@example.com \
              tag -a --cleanup=whitespace -m "$MESSAGE" v0.0.0-test
          else
            git tag v0.0.0-test
          fi

      - name: Create releases
        uses: ./actions/github-release

      - name: Check notes
        env:
          EXPECTED: ${{ matrix.notes }}
        run: |
          actual=$(cat "$RUNNER_TEMP/notes")

          if [[ "$actual" != "$EXPECTED" ]]; then
            echo "::error::Expected notes '$EXPECTED', got '$actual'."
            exit 1
          fi

  merge-base:
    name: Merge base (${{ matrix.case }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: shallow
            fetch-depth: 1
          - case: complete
            fetch-depth: 0
          - case: local
            fetch-depth: 0
          - case: uncommitted
            fetch-depth: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
          persist-credentials: false

      - name: Change the working tree
        if: matrix.case == 'uncommitted'
        run: |
          echo uncommitted >> README.md
          rm license
          echo uncommitted > 'uncommitted change'

      - name: Find merge base
        id: merge-base
        if: matrix.case != 'local'
        uses: ./actions/merge-base

      - name: Find merge base of a local commit
        if: matrix.case == 'local'
        run: |
          echo local > local-change
          git add local-change
          git -c user.name=local -c user.email=local@localhost commit --quiet --message 'Change locally'
          env -u GITHUB_ACTIONS -u GITHUB_OUTPUT -u GITHUB_REF -u GITHUB_SHA actions/merge-base/merge-base.sh

      - name: Check result
        env:
          SHA: ${{ steps.merge-base.outputs.sha }}
          HEAD_SHA: ${{ steps.merge-base.outputs.head }}
          BASE: ${{ (matrix.case != 'local' && github.base_ref) || github.event.repository.default_branch }}
          SHALLOW: ${{ matrix.case == 'shallow' || matrix.case == 'uncommitted' }}
          LOCAL: ${{ matrix.case == 'local' }}
          UNCOMMITTED: ${{ matrix.case == 'uncommitted' }}
        run: |
          if [[ $(git rev-parse --is-shallow-repository) != "$SHALLOW" ]]; then
            echo '::error::Expected the checkout to keep its depth.'
            exit 1
          fi

          if [[ $SHALLOW == true ]]; then
            git fetch --quiet --no-tags --unshallow origin \
              "$(git rev-parse HEAD)" "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          fi

          if [[ $GITHUB_REF == refs/pull/*/merge && $(git rev-parse HEAD) == "$GITHUB_SHA" ]]; then
            head=$(git rev-parse HEAD^2)
            sha=$(git merge-base HEAD^1 HEAD^2)
          else
            head=$(git rev-parse HEAD)
            sha=$(git merge-base HEAD "origin/${BASE}")
          fi

          if [[ $(< .merge-base/sha) != "$sha" || $(< .merge-base/ref) != "$BASE" ]]; then
            echo "::error::Expected .merge-base to hold $sha and $BASE."
            exit 1
          fi

          if [[ $LOCAL == false && ($SHA != "$sha" || $HEAD_SHA != "$head") ]]; then
            echo "::error::Expected merge base $sha of $head, got $SHA of $HEAD_SHA."
            exit 1
          fi

          change=$head
          if [[ $UNCOMMITTED == true ]]; then
            git worktree add --quiet --detach "$RUNNER_TEMP/change" "$head"
            echo uncommitted >> "$RUNNER_TEMP/change/README.md"
            rm "$RUNNER_TEMP/change/license"
            echo uncommitted > "$RUNNER_TEMP/change/uncommitted change"
            git -C "$RUNNER_TEMP/change" add --all
            git -C "$RUNNER_TEMP/change" -c user.name=change -c user.email=change@localhost \
              commit --quiet --message 'Commit the uncommitted changes'
            change=$(git -C "$RUNNER_TEMP/change" rev-parse HEAD)
          fi

          if ! git -c core.quotePath=false diff --name-status --no-renames -z "$sha" "$change" |
            cmp - .merge-base/changes; then
            echo '::error::Expected .merge-base/changes to match the diff from the full history.'
            exit 1
          fi

  posthog-trace-status:
    name: PostHog trace status (${{ matrix.case }})
    runs-on: ubuntu-latest
    permissions: {}

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: no-url
          - case: insecure-url
            url: http://eu.posthog.com/project/1/tracing?trace=0af7651916cd43dd8448eb211c80319c
          - case: short-sha
            url: https://eu.posthog.com/project/1/tracing?trace=0af7651916cd43dd8448eb211c80319c
            sha: abc1234
          - case: unauthorized
            url: https://eu.posthog.com/project/1/tracing?trace=0af7651916cd43dd8448eb211c80319c
            token: not-a-token

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every case must be skipped or fail to publish without failing the step,
      # which would otherwise fail the job.
      - name: Publish trace status
        id: status
        uses: ./actions/posthog-trace-status
        with:
          url: ${{ matrix.url }}
          sha: ${{ matrix.sha || github.sha }}
          token: ${{ matrix.token || github.token }}

      - name: Check result
        env:
          PUBLISHED: ${{ steps.status.outputs.published }}
        run: |
          if [[ "$PUBLISHED" != false ]]; then
            echo "::error::Expected no status to be published, got '$PUBLISHED'."
            exit 1
          fi

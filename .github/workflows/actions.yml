name: Actions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/actions.yml
      - actions/dagger-version/**
      - actions/github-release/**
      - actions/image-status/**
      - actions/posthog-trace-status/**
  pull_request:
    paths:
      - .github/workflows/actions.yml
      - actions/dagger-version/**
      - actions/github-release/**
      - actions/image-status/**
      - actions/posthog-trace-status/**

jobs:
  dagger-version:
    name: Dagger version (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: valid
            version: v1.0.0-beta.14
          - fixture: no-manifests
          - fixture: missing-engine-version
          - fixture: invalid-engine-version
          - fixture: mismatched-engine-versions

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        continue-on-error: true
        uses: ./actions/dagger-version
        with:
          working-directory: actions/dagger-version/fixtures/${{ matrix.fixture }}

      - name: Check result
        env:
          OUTCOME: ${{ steps.resolve.outcome }}
          ACTUAL: ${{ steps.resolve.outputs.version }}
          EXPECTED: ${{ matrix.version }}
        run: |
          expected_outcome=$([[ -n "$EXPECTED" ]] && echo success || echo failure)

          if [[ "$OUTCOME" != "$expected_outcome" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Expected $expected_outcome with version '$EXPECTED', got $OUTCOME with version '$ACTUAL'."
            exit 1
          fi

  github-release:
    name: GitHub release (${{ matrix.case }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: no-tags
          - case: released-tags
            tags: v0.16.0 v0.17.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag HEAD
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          for tag in $TAGS; do
            git tag "$tag"
          done

      - name: Create releases
        uses: ./actions/github-release

  github-release-notes:
    name: GitHub release notes (${{ matrix.case }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: annotated
            message: |-
              ### Patches

              - Fix the thing
            notes: |-
              ### Patches

              - Fix the thing
          - case: tag-name
            message: v0.0.0-test
          - case: lightweight

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stub gh
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" << 'EOF'
          #!/usr/bin/env bash
          [[ $2 == view ]] && exit 1
          while (( $# )); do
            [[ $1 == --notes ]] && printf '%s' "$2" > "$RUNNER_TEMP/notes"
            shift
          done
          EOF
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Tag HEAD
        env:
          MESSAGE: ${{ matrix.message }}
        run: |
          if [[ -n $MESSAGE ]]; then
            git -c user.name=test -c user.email=test@example.com \
              tag -a --cleanup=whitespace -m "$MESSAGE" v0.0.0-test
          else
            git tag v0.0.0-test
          fi

      - name: Create releases
        uses: ./actions/github-release

      - name: Check notes
        env:
          EXPECTED: ${{ matrix.notes }}
        run: |
          actual=$(cat "$RUNNER_TEMP/notes")

          if [[ "$actual" != "$EXPECTED" ]]; then
            echo "::error::Expected notes '$EXPECTED', got '$actual'."
            exit 1
          fi

  image-status:
    name: Image status (${{ matrix.case }})
    runs-on: ubuntu-latest
    permissions: {}

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: built
            description: 1.00 MiB
          - case: published
            image: ghcr.io/langri-sha/image-status-test:main
            address: ghcr.io/langri-sha/image-status-test:main
            description: ghcr.io/langri-sha/image-status-test:main (1.00 MiB)
          - case: long-address
            address: us-docker.pkg.dev/a-rather-long-google-cloud-project-id/a-rather-long-repository-name/some-application-image:0123456789abcdef0123456789abcdef01234567
            description: us-docker.pkg.dev/a-rather-long-google-cloud-project-id/a-rather-long-repository-name/some-application-image:0123456789abcdef0... (1.00 MiB)
          - case: missing-image
            image: image-status-missing
          - case: short-sha
            sha: abc1234
          - case: unauthorized
            token: not-a-token

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: |
          mkdir "$RUNNER_TEMP/image"
          head --bytes 1048576 /dev/urandom > "$RUNNER_TEMP/image/data"
          printf 'FROM scratch\nCOPY data /data\n' > "$RUNNER_TEMP/image/Dockerfile"

          docker build \
            --tag ghcr.io/langri-sha/image-status-test:main \
            --tag image-status-test \
            "$RUNNER_TEMP/image"

      - name: Stub gh
        if: matrix.case != 'unauthorized'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" << 'EOF'
          #!/usr/bin/env bash
          while (( $# )); do
            [[ $1 == -f ]] && printf '%s\n' "$2" >> "$RUNNER_TEMP/fields"
            shift
          done
          EOF
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Every case must publish or fail to without failing the step, which
      # would otherwise fail the job.
      - name: Publish image status
        id: status
        uses: ./actions/image-status
        with:
          image: ${{ matrix.image || 'image-status-test' }}
          address: ${{ matrix.address }}
          sha: ${{ matrix.sha || github.sha }}
          token: ${{ matrix.token || github.token }}

      - name: Check result
        env:
          CASE: ${{ matrix.case }}
          DESCRIPTION: ${{ matrix.description }}
          PUBLISHED: ${{ steps.status.outputs.published }}
          SIZE: ${{ steps.status.outputs.size }}
        run: |
          expected=$([[ -n $DESCRIPTION ]] && echo true || echo false)

          if [[ "$PUBLISHED" != "$expected" ]]; then
            echo "::error::Expected published to be $expected, got '$PUBLISHED'."
            exit 1
          fi

          if [[ $CASE == missing-image && -n $SIZE ]] || [[ $CASE != missing-image && -z $SIZE ]]; then
            echo "::error::Unexpected size '$SIZE'."
            exit 1
          fi

          if [[ -n $DESCRIPTION ]]; then
            for field in context=image/image-status-test "description=$DESCRIPTION"; do
              if ! grep --quiet --fixed-strings --line-regexp "$field" "$RUNNER_TEMP/fields"; then
                echo "::error::Expected '$field', got: $(paste -sd ' ' "$RUNNER_TEMP/fields")"
                exit 1
              fi
            done
          fi

  posthog-trace-status:
    name: PostHog trace status (${{ matrix.case }})
    runs-on: ubuntu-latest
    permissions: {}

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: no-url
          - case: insecure-url
            url: http://eu.posthog.com/project/1/tracing?trace=0af7651916cd43dd8448eb211c80319c
          - case: short-sha
            url: https://eu.posthog.com/project/1/tracing?trace=0af7651916cd43dd8448eb211c80319c
            sha: abc1234
          - case: unauthorized
            url: https://eu.posthog.com/project/1/tracing?trace=0af7651916cd43dd8448eb211c80319c
            token: not-a-token

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every case must be skipped or fail to publish without failing the step,
      # which would otherwise fail the job.
      - name: Publish trace status
        id: status
        uses: ./actions/posthog-trace-status
        with:
          url: ${{ matrix.url }}
          sha: ${{ matrix.sha || github.sha }}
          token: ${{ matrix.token || github.token }}

      - name: Check result
        env:
          PUBLISHED: ${{ steps.status.outputs.published }}
        run: |
          if [[ "$PUBLISHED" != false ]]; then
            echo "::error::Expected no status to be published, got '$PUBLISHED'."
            exit 1
          fi
